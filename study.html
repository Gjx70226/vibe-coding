<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新词学习 · 四级备考助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景光斑：纯装饰 -->
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <!-- 无障碍：键盘第一下 Tab 就能跳过导航直接进正文 -->
  <a class="skip-link" href="#main">跳到正文</a>

  <!-- 顶部胶囊导航：三个页面互相跳（当前页用 aria-current 标出来，读屏会读「当前项」） -->
  <nav class="pill-nav">
    <a href="index.html" data-page="index">首页</a>
    <a href="study.html" data-page="study" aria-current="page">新词学习</a>
    <a href="review.html" data-page="review">错题复习</a>
  </nav>

  <main class="container" id="main" tabindex="-1">
    <!-- 加载中转圈（四态之"加载中"） -->
    <div class="loading" id="loading"><div class="spinner"></div><span>加载中…</span></div>

    <div id="content" hidden>
    <!-- 答题卡片 -->
    <section class="quiz-card" id="quiz">
      <div class="progress" id="progress"></div>
      <div class="word-head has-detail">
        <a class="word-detail" id="detailLink" href="#">详情</a>
        <button class="fav-btn" id="favBtn" type="button" aria-label="收藏单词">
          <span class="star-empty">☆</span><span class="star-full">★</span>
        </button>
      </div>
      <div class="word-display" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" style="display:none"></button>
    </section>

    <!-- 空状态：词库未加载/异常时显示，避免白屏 -->
    <div class="empty-box" id="studyEmpty" hidden>⚠️ 词库加载异常，请刷新页面重试</div>

    <!-- 一轮结束的结果卡片（默认隐藏） -->
    <section class="result-card" id="result" style="display:none"></section>
    </div><!-- /#content -->

    <!-- 出错状态：模拟加载失败时显示红条+重试（四态之"出错"） -->
    <div class="error-box" id="errorBox" hidden>
      <div class="err-icon">⚠️</div>
      <div class="err-text">加载失败，请检查网络后重试</div>
      <button class="retry-btn" id="retryBtn" type="button">重试</button>
    </div>
  </main>

  <!-- 顺序不能反：先词库 → 再存储层(app.js) → 再本页逻辑(study.js) -->
  <script src="components.js"></script>
  <script src="store.js"></script>
  <script src="words.js"></script>
  <!-- 切页播报腔：读屏软件会念这里的一句话（眼睛看不见） -->
  <div id="srLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
  <script src="study.js"></script>
</body>
</html>

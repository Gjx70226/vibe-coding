<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四级备考助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景光斑：纯装饰，让白底不单调 -->
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <!-- 无障碍：键盘第一下 Tab 就能跳过导航直接进正文 -->
  <a class="skip-link" href="#main">跳到正文</a>

  <!-- 顶部胶囊导航：改成 hash 链接，点一下不刷新页面，只换中间那块（data-route 给路由做高亮） -->
  <nav class="pill-nav">
    <a href="#/" data-route="home">首页</a>
    <a href="#/study" data-route="study">新词学习</a>
    <a href="#/review" data-route="review">错题复习</a>
    <a href="#/daily" data-route="daily">每日复习</a>
  </nav>

  <main class="container" id="main" tabindex="-1">
    <!-- 加载中转圈：切视图先显示，400ms 后换成正文（四态之"加载中"） -->
    <div class="loading" id="loading"><div class="spinner"></div><span>加载中…</span></div>

    <!-- 路由把对应视图的 HTML 塞进这个盒子（四态之"成功/空"都走它） -->
    <div id="content" hidden></div>

    <!-- 出错状态：视图崩了/模拟失败时显示红条+重试（四态之"出错"） -->
    <div class="error-box" id="errorBox" hidden>
      <div class="err-icon">⚠️</div>
      <div class="err-text">加载失败，请检查网络后重试</div>
      <button class="retry-btn" id="retryBtn" type="button">重试</button>
    </div>
  </main>

  <!-- 先引入词库与公共层，再引入四个视图，最后引入路由（顺序不能反） -->
  <script src="components.js"></script>
  <script src="store.js"></script>
  <script src="words.js"></script>
  <script src="quiz.js"></script>     <!-- 答题卡公共零件（学习/复习/每日三处共用） -->
  <script src="app.js"></script>      <!-- 首页视图 HomeView -->
  <script src="study.js"></script>    <!-- 学习视图 StudyView -->
  <script src="review.js"></script>   <!-- 复习视图 ReviewView -->
  <script src="daily.js"></script>    <!-- 每日复习视图 DailyView -->
  <script src="list.js"></script>     <!-- 词表统计视图 ListView -->
  <script src="detail.js"></script>   <!-- 详情视图 DetailView -->
  <script src="router.js"></script>   <!-- 最后启动路由 -->
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题复习 · 四级备考助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <nav class="pill-nav">
    <a href="index.html" data-page="index">首页</a>
    <a href="study.html" data-page="study">新词学习</a>
    <a href="review.html" data-page="review">错题复习</a>
  </nav>

  <main class="container">
    <header class="hero">
      <h1>错题复习 <span class="heart">🔁</span></h1>
      <p class="subtitle">看中文释义，选出正确英文单词；答对即移出待复习</p>
    </header>

    <section class="quiz-card" id="quiz">
      <div class="progress" id="progress"></div>
      <div class="word-display" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" style="display:none"></button>
    </section>

    <section class="result-card" id="result" style="display:none"></section>
  </main>

  <!-- 顺序：先词库 → 再存储层(app.js) → 再本页逻辑(review.js) -->
  <script src="words.js"></script>
  <script src="app.js"></script>
  <script src="review.js"></script>
</body>
</html>

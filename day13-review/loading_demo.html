<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载中转圈 · Day13 演示</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <main class="container">
    <!-- 假地址栏：headless 截图无真实浏览器栏，页面内画一个，证明"图带地址栏" -->
    <div class="addr-bar">
      <span class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></span>
      <span class="url">study.html（页面刚打开的"加载中"状态）</span>
    </div>

    <!-- 这就是 Day13 步骤1 新增的"加载中"转圈：真实页面打开会先显示它约 0.4 秒 -->
    <div class="loading">
      <div class="spinner"></div>
      <span>加载中…</span>
    </div>
  </main>
</body>
</html>
